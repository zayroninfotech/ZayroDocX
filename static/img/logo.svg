<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dc2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fecaca;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="10" y="10" width="180" height="180" rx="36" ry="36" fill="url(#bgGrad)" filter="url(#shadow)"/>

  <!-- Document icon (white) -->
  <rect x="70" y="32" width="68" height="84" rx="8" ry="8" fill="white" opacity="0.95"/>
  <!-- Folded corner -->
  <polygon points="118,32 138,52 118,52" fill="#fca5a5"/>
  <line x1="118" y1="32" x2="138" y2="52" stroke="#dc2626" stroke-width="1.5"/>
  <!-- Doc lines -->
  <rect x="80" y="62" width="38" height="5" rx="2.5" fill="#dc2626" opacity="0.5"/>
  <rect x="80" y="73" width="30" height="5" rx="2.5" fill="#dc2626" opacity="0.4"/>
  <rect x="80" y="84" width="34" height="5" rx="2.5" fill="#dc2626" opacity="0.3"/>

  <!-- Bold Z letterform -->
  <polygon points="32,118 32,103 118,103 118,115 55,152 118,152 118,168 30,168 30,156 95,118" fill="white"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#991b1b"/>
    </linearGradient>
    <linearGradient id="docShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#fecaca;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Rounded square bg -->
  <rect width="160" height="160" rx="32" ry="32" fill="url(#bg)"/>

  <!-- Subtle inner glow top-left -->
  <rect width="160" height="160" rx="32" ry="32" fill="url(#bg)" opacity="0"/>
  <ellipse cx="30" cy="28" rx="60" ry="44" fill="rgba(255,255,255,0.10)"/>

  <!-- Document shape (white) -->
  <rect x="88" y="18" width="46" height="58" rx="6" fill="white" opacity="0.95"/>
  <!-- Folded corner -->
  <polygon points="122,18 134,30 122,30" fill="#fca5a5"/>
  <!-- Doc lines -->
  <rect x="95" y="38" width="26" height="4" rx="2" fill="#dc2626" opacity="0.35"/>
  <rect x="95" y="47" width="20" height="4" rx="2" fill="#dc2626" opacity="0.28"/>
  <rect x="95" y="56" width="23" height="4" rx="2" fill="#dc2626" opacity="0.22"/>

  <!-- Bold Z -->
  <text x="14" y="130"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="108"
    fill="white"
    letter-spacing="-4">Z</text>

  <!-- Red underline accent -->
  <rect x="14" y="138" width="72" height="7" rx="3.5" fill="rgba(255,255,255,0.45)"/>
</svg>

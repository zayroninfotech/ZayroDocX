{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZayroEye — Secure Login</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:linear-gradient(135deg,#0f172a 0%,#1e1b4b 60%,#0f172a 100%);display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif;padding:1rem}
.card{background:rgba(255,255,255,.04);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:2.5rem 2rem;width:100%;max-width:380px;text-align:center}
.eye-icon{width:72px;height:72px;background:linear-gradient(135deg,#dc2626,#b91c1c);border-radius:20px;display:inline-flex;align-items:center;justify-content:center;font-size:2rem;color:#fff;margin-bottom:1.2rem;box-shadow:0 8px 32px rgba(220,38,38,.35)}
h1{font-size:1.5rem;font-weight:900;color:#fff;margin-bottom:.3rem}
p{font-size:.82rem;color:#94a3b8;margin-bottom:1.8rem}
.field{margin-bottom:1rem;text-align:left}
.field label{font-size:.72rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:.35rem}
.field input{width:100%;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.1);border-radius:11px;padding:.65rem 1rem;font-size:.9rem;color:#fff;outline:none;transition:border-color .15s;font-family:inherit}
.field input:focus{border-color:#dc2626;box-shadow:0 0 0 3px rgba(220,38,38,.15)}
.field input::placeholder{color:#475569}
.err{background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.3);border-radius:10px;padding:.6rem 1rem;font-size:.8rem;color:#fca5a5;font-weight:600;margin-bottom:1rem;display:{% if error %}block{% else %}none{% endif %}}
.btn{width:100%;padding:.75rem;background:linear-gradient(135deg,#dc2626,#b91c1c);color:#fff;border:none;border-radius:12px;font-size:.95rem;font-weight:800;cursor:pointer;transition:opacity .15s;margin-top:.5rem}
.btn:hover{opacity:.88}
.lock{font-size:.72rem;color:#475569;margin-top:1.2rem;display:flex;align-items:center;justify-content:center;gap:.4rem}
</style>
</head>
<body>
<div class="card">
  <div class="eye-icon"><i class="fa-solid fa-eye"></i></div>
  <h1>ZayroEye</h1>
  <p>Restricted access. Enter your credentials to continue.</p>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label>Username</label>
      <input type="text" name="username" placeholder="Enter username" autofocus autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" name="password" placeholder="Enter password" autocomplete="current-password">
    </div>
    <button class="btn" type="submit"><i class="fa-solid fa-unlock-keyhole"></i> Access ZayroEye</button>
  </form>
  <div class="lock"><i class="fa-solid fa-shield-halved"></i> Authorized personnel only</div>
</div>
</body>
</html>
